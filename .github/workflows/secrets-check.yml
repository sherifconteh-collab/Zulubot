name: Secret Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        run: |
          chmod +x scripts/detect-secrets.sh
          bash scripts/detect-secrets.sh
