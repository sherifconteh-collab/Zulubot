name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Read-only by default; the one job below declares the narrower write access it needs.
permissions:
  contents: read

jobs:
  cla:
    if: |
      (github.event_name == 'pull_request_target' && github.event.action != 'closed') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
        github.event.comment.body == 'recheck'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # This workflow never checks out or runs pull-request code (pull_request_target runs with
      # write access), it only reads the PR's author and records signatures.
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If branch protection blocks the bot from pushing signatures to main, add a
          # fine-grained token as a repository secret named PERSONAL_ACCESS_TOKEN.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/sherifconteh-collab/Zulubot/blob/main/CLA.md'
          branch: 'main'
          allowlist: dependabot[bot],github-actions[bot],copilot-swe-agent[bot],Copilot,Claude,claude,claude[bot],sherifconteh-collab
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge this PR, we need
            you to sign our Contributor License Agreement (CLA). This is a one-time
            requirement for all contributors.

            **To sign the CLA**, please comment on this PR with:

            `I have read the CLA Document and I hereby sign the CLA`
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
